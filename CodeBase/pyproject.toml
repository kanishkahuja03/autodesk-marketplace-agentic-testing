[project]
name = "mpagent"
version = "0.1.0"
description = "Agent pipeline that designs and runs validation tests for Autodesk Marketplace plug-ins"
readme = "README.md"
authors = [
    { name = "kanishkahuja03", email = "kanishk.ahuja@cctech.co.in" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "openai-agents>=0.23.1",
    "pydantic>=2.14.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pywin32>=312",
    "pywinauto>=0.6.9",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
    "winrt-runtime>=4.0.3",
    "winrt-windows-foundation>=4!10.0.28000.2705",
    "winrt-windows-globalization>=4!10.0.28000.2705",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2705",
    "winrt-windows-media-ocr>=4!10.0.28000.2705",
    "winrt-windows-storage-streams>=4!10.0.28000.2705",
]

[project.scripts]
mpagent = "mpagent.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
